services:
  - type: web
    name: verdra-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: FRONTEND_URL
        value: https://verdrax.vercel.app
      - key: PYTHON_VERSION
        value: 3.11.9
